# Runs TurboCAT's tests on Linux, Windows and macOS on every push, so problems on systems
# nobody here has (Windows, macOS) show up straight away. The tests need no screen
# (QT_QPA_PLATFORM=offscreen) and no network.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false            # see every system's result, even when one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Qt's libraries and the helper programs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            lhasa xdms libopenmpt0 libxmp4

      - name: Python packages
        run: python -m pip install -r requirements.txt

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

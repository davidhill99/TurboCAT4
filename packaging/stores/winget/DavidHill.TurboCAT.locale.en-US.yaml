ShortDescription: Catalogue, search and repair your Amiga disk images, and take the catalogue to a real Amiga.
Description: >-
  TurboCAT 4 catalogues Amiga disk images, archives and folders: what is on every disk, which are games,
  which have problems or duplicates, their pictures and their music. It repairs damaged disks from your
  own collection, plays disks in an emulator, copies them to a Gotek, and makes TurboView floppies to
  look things up on a real Amiga. A revival of TurboCAT and TurboCAT-Pro (1994-1996).
